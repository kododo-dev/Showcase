name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The deploy workflow runs CI first.
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build src/Showcase/Showcase.csproj --configuration Release

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t showcase:ci .
