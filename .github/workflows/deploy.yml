name: Deploy

# The public showcase (kododo.dev/showcase) runs on the VPS next to the Way demos, on their shared PostgreSQL.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kododo-dev/showcase

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  push:
    name: Build & push
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [push]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,REPO_OWNER
          script: |
            set -e
            IMAGE="ghcr.io/$REPO_OWNER/showcase:latest"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$REPO_OWNER" --password-stdin
            docker pull "$IMAGE"
            # The app creates its tables, not the database.
            docker exec postgres psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'showcase'" | grep -q 1 \
              || docker exec postgres createdb -U postgres showcase
            docker stop showcase || true
            docker rm showcase || true
            docker run -d \
              --name showcase \
              --restart unless-stopped \
              --network web \
              -e "ConnectionStrings__ShowcaseDB=host=postgres;port=5432;database=showcase;user id=postgres;password=postgres;Gss Encryption Mode=Disable" \
              -e "PathBase=/showcase" \
              "$IMAGE"
            docker network connect internal showcase
